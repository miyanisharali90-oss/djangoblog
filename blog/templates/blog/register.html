
{% extends "blog/base.html" %}

{% block title %}Create a Post{% endblock %}

{% block content %}
<h1>Create a Post</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Save Post
    </button>
</form>
{% endblock %}
